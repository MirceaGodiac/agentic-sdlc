# Price table used by the Usage Meter (USD per `per` tokens).
# Every usage record stores the `version` it was priced with, so bump the version whenever you edit prices:
# old runs keep the cost they were charged at.
#
# These are example list prices. Check them against your provider's current pricing before relying on budgets.
# Override with <home>/prices.yaml, AGENTP_PRICES=path, or --prices path.
version: "2025-08-example"
per: 1000000
models:
  openai/gpt-5:          { input: 1.25, cache_read: 0.125, output: 10.00 }
  openai/gpt-5-mini:     { input: 0.25, cache_read: 0.025, output: 2.00 }
  openai/gpt-5-nano:     { input: 0.05, cache_read: 0.005, output: 0.40 }
  openai/gpt-4.1:        { input: 2.00, cache_read: 0.50,  output: 8.00 }
  openai/gpt-4.1-mini:   { input: 0.40, cache_read: 0.10,  output: 1.60 }
  openai/gpt-4.1-nano:   { input: 0.10, cache_read: 0.025, output: 0.40 }
  openai/gpt-4o:         { input: 2.50, cache_read: 1.25,  output: 10.00 }
  openai/gpt-4o-mini:    { input: 0.15, cache_read: 0.075, output: 0.60 }
  openai/o4-mini:        { input: 1.10, cache_read: 0.275, output: 4.40 }
  openai/o3:             { input: 2.00, cache_read: 0.50,  output: 8.00 }
